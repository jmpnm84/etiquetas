<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Etiquetas pequenas</title>

<!-- Configurações PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Etiquetas">

<style>

  /* =====================================================
     CONFIGURAÇÃO A4
     ===================================================== */

  @page {
    size: A4 portrait;
    margin: 0;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 210mm;
    min-height: 297mm;
    background: #fff;
    font-family: Calibri, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }


  /* =====================================================
     BARRA DE FERRAMENTAS (SEMPRE VISÍVEL / RESPONSIVA)
     ===================================================== */

  .toolbar {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(6px);
    border: 1px solid #ccc;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.18);
    max-width: 96vw;
    overflow-x: auto;
    white-space: nowrap;
  }

  .logo-container {
    display: flex;
    align-items: center;
    height: 28px;
    flex-shrink: 0;
  }

  .logo-container img {
    height: 100%;
    width: auto;
    display: block;
    object-fit: contain;
  }

  .lang-select-container {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #f4f6f8;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid #ddd;
    flex-shrink: 0;
  }

  .lang-select-container select {
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }

  .toolbar button {
    border: 0;
    border-radius: 6px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    flex-shrink: 0;
  }

  #fillBtn {
    background: #1f6feb;
    color: white;
  }

  #printBtn {
    background: #222;
    color: white;
  }

  .toolbar button:hover {
    opacity: 0.9;
  }


  /* =====================================================
     PÁGINA A4
     ===================================================== */

  .page {
    position: relative;
    width: 210mm;
    height: 297mm;
    overflow: hidden;
    background: #fff;
  }


  /* =====================================================
     CAMPOS DAS ETIQUETAS
     ===================================================== */

  .box {
    position: absolute;
    border: 0.25mm dotted rgba(0, 0, 0, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    font-family: Calibri, Arial, sans-serif;
    font-size: 8pt;
    line-height: 1;
    font-weight: 400;
    color: #000;
    white-space: nowrap;
  }


  /* =====================================================
     JANELA DE PREENCHIMENTO
     ===================================================== */

  dialog {
    border: 0;
    border-radius: 10px;
    padding: 0;
    width: min(430px, calc(100vw - 32px));
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
  }

  dialog::backdrop {
    background: rgba(0, 0, 0, 0.4);
  }

  .form {
    padding: 22px;
  }

  .form h2 {
    margin: 0 0 16px;
    font-size: 20px;
  }

  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
  }

  .field input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-family: inherit;
    font-size: 16px;
  }

  .field input:focus {
    outline: 2px solid #1f6feb;
    outline-offset: 1px;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  .actions button {
    padding: 9px 15px;
    border-radius: 6px;
    border: 1px solid #bbb;
    background: white;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    touch-action: manipulation;
  }

  .actions .apply {
    border: 0;
    background: #1f6feb;
    color: white;
    font-weight: 600;
  }


  /* =====================================================
     VISUALIZAÇÃO NO ECRÃ
     ===================================================== */

  @media screen {
    body {
      background: #eee;
      /* Espaço superior para a barra fixa não sobrepor a página em ecrãs pequenos */
      padding-top: 55px;
    }

    .page {
      margin: 10mm auto;
      box-shadow: 0 0 4mm rgba(0, 0, 0, 0.18);
    }
  }


  /* =====================================================
     IMPRESSÃO
     ===================================================== */

  @media print {
    html,
    body {
      width: 210mm;
      height: 297mm;
      margin: 0;
      background: white;
      padding-top: 0 !important;
    }

    .toolbar {
      display: none !important;
    }

    .page {
      margin: 0;
      box-shadow: none;
    }
  }

</style>

</head>


<body>

<!-- =====================================================
     BARRA DE FERRAMENTAS E LOGÓTIPO (AO CENTRO)
     ===================================================== -->

<div class="toolbar">

  <div class="logo-container">
    <img src="https://github.com/user-attachments/assets/e4e16378-571e-444d-94ef-916a51a81675" alt="Logótipo">
  </div>

  <!-- SELETOR DE IDIOMA COM BANDEIRAS -->
  <div class="lang-select-container">
    <select id="langSelect" aria-label="Idioma">
      <option value="pt">🇵🇹 PT</option>
      <option value="es">🇪🇸 ES</option>
      <option value="en">🇬🇧 EN</option>
      <option value="fr">🇫🇷 FR</option>
    </select>
  </div>

  <button id="fillBtn" type="button" data-i18n="fill">
    Preencher
  </button>

  <button id="printBtn" type="button" data-i18n="print">
    Imprimir
  </button>

</div>



<!-- =====================================================
     PÁGINA A4
     ===================================================== -->

<div class="page"></div>



<!-- =====================================================
     FORMULÁRIO
     ===================================================== -->

<dialog id="fillDialog">

  <form class="form" method="dialog" id="fillForm">

    <h2 data-i18n="formTitle">
      Preencher etiquetas
    </h2>

    <!-- DIA -->
    <div class="field">
      <label for="dia" data-i18n="labelDay">Dia</label>
      <input id="dia" name="dia" type="text" inputmode="numeric" maxlength="2" placeholder="Ex.: 31" required>
    </div>

    <!-- MÊS -->
    <div class="field">
      <label for="mes" data-i18n="labelMonth">Mês</label>
      <input id="mes" name="mes" type="text" inputmode="numeric" maxlength="2" placeholder="Ex.: 08" required>
    </div>

    <!-- ANO -->
    <div class="field">
      <label for="ano" data-i18n="labelYear">Ano</label>
      <input id="ano" name="ano" type="text" inputmode="numeric" maxlength="4" placeholder="Ex.: 2026" required>
    </div>

    <!-- NÚMERO COLABORADOR -->
    <div class="field">
      <label for="colaborador" data-i18n="labelCollab">Número do colaborador</label>
      <input id="colaborador" name="colaborador" type="text" placeholder="Ex.: 06/59" required>
    </div>

    <!-- REFERÊNCIA -->
    <div class="field">
      <label for="referencia" data-i18n="labelRef">Referência</label>
      <input id="referencia" name="referencia" type="text" placeholder="Ex.: 501" required>
    </div>

    <!-- BOTÕES DO FORMULÁRIO -->
    <div class="actions">
      <button type="button" id="cancelBtn" data-i18n="cancel">Cancelar</button>
      <button type="submit" class="apply" data-i18n="apply">Aplicar</button>
    </div>

  </form>

</dialog>



<script>

/* =========================================================
   TRADUÇÕES (IDIOMAS)
   ========================================================= */
const translations = {
  pt: {
    fill: "Preencher",
    print: "Imprimir",
    formTitle: "Preencher etiquetas",
    labelDay: "Dia",
    labelMonth: "Mês",
    labelYear: "Ano",
    labelCollab: "Número do colaborador",
    labelRef: "Referência",
    cancel: "Cancelar",
    apply: "Aplicar",
    placeholderDay: "Ex.: 31",
    placeholderMonth: "Ex.: 08",
    placeholderYear: "Ex.: 2026",
    placeholderCollab: "Ex.: 06/59",
    placeholderRef: "Ex.: 501"
  },
  es: {
    fill: "Rellenar",
    print: "Imprimir",
    formTitle: "Rellenar etiquetas",
    labelDay: "Día",
    labelMonth: "Mes",
    labelYear: "Año",
    labelCollab: "Número de colaborador",
    labelRef: "Referencia",
    cancel: "Cancelar",
    apply: "Aplicar",
    placeholderDay: "Ej.: 31",
    placeholderMonth: "Ej.: 08",
    placeholderYear: "Ej.: 2026",
    placeholderCollab: "Ej.: 06/59",
    placeholderRef: "Ej.: 501"
  },
  en: {
    fill: "Fill",
    print: "Print",
    formTitle: "Fill labels",
    labelDay: "Day",
    labelMonth: "Month",
    labelYear: "Year",
    labelCollab: "Collaborator number",
    labelRef: "Reference",
    cancel: "Cancel",
    apply: "Apply",
    placeholderDay: "Ex.: 31",
    placeholderMonth: "Ex.: 08",
    placeholderYear: "Ex.: 2026",
    placeholderCollab: "Ex.: 06/59",
    placeholderRef: "Ex.: 501"
  },
  fr: {
    fill: "Remplir",
    print: "Imprimer",
    formTitle: "Remplir les étiquettes",
    labelDay: "Jour",
    labelMonth: "Mois",
    labelYear: "Année",
    labelCollab: "Numéro de collaborateur",
    labelRef: "Référence",
    cancel: "Annuler",
    apply: "Appliquer",
    placeholderDay: "Ex. : 31",
    placeholderMonth: "Ex. : 08",
    placeholderYear: "Ex. : 2026",
    placeholderCollab: "Ex. : 06/59",
    placeholderRef: "Ex. : 501"
  }
};

function setLanguage(lang) {
  const t = translations[lang] || translations.pt;
  
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (t[key]) {
      el.textContent = t[key];
    }
  });

  document.getElementById("dia").placeholder = t.placeholderDay;
  document.getElementById("mes").placeholder = t.placeholderMonth;
  document.getElementById("ano").placeholder = t.placeholderYear;
  document.getElementById("colaborador").placeholder = t.placeholderCollab;
  document.getElementById("referencia").placeholder = t.placeholderRef;

  document.documentElement.lang = lang === 'pt' ? 'pt-PT' : lang;
}

document.getElementById("langSelect").addEventListener("change", (e) => {
  setLanguage(e.target.value);
});


/* =========================================================
   REGISTO DO SERVICE WORKER (PWA)
   ========================================================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(() => console.log("Service Worker registado com sucesso!"))
      .catch((err) => console.log("Erro ao registar Service Worker:", err));
  });
}


/* =========================================================
   CONFIGURAÇÃO DA GRELHA
   ========================================================= */

const originX = 9.31;
const originY = 10.90;

const xs = [
  0.0,
  52.8585,
  105.7170,
  158.6739
];

const ys = [
  0.0,
  24.791,
  49.219,
  74.009,
  98.213,
  123.004,
  147.432,
  172.223,
  196.427,
  221.217,
  245.645,
  270.436
];

const fields = {
  dia: { x: 0.0, y: 0.0, width: 4.81, height: 3.79 },
  mes: { x: 7.1856, y: 0.0, width: 4.81, height: 3.79 },
  ano: { x: 13.4853, y: 0.0, width: 8.6621, height: 3.79 },
  colaborador: { x: 28.6926, y: 0.0, width: 8.6629, height: 3.79 },
  referencia: { x: 2.4608, y: 5.8075, width: 8.6621, height: 3.79 }
};

function getCurrentDate() {
  const today = new Date();
  const day = String(today.getDate()).padStart(2, "0");
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const year = String(today.getFullYear());

  return { dia: day, mes: month, ano: year };
}

const currentDate = getCurrentDate();

const values = {
  dia: currentDate.dia,
  mes: currentDate.mes,
  ano: currentDate.ano,
  colaborador: "",
  referencia: ""
};

const page = document.querySelector(".page");

for (let row = 0; row < ys.length; row++) {
  for (let col = 0; col < xs.length; col++) {
    const labelX = originX + xs[col];
    const labelY = originY + ys[row];

    Object.entries(fields).forEach(([fieldName, field]) => {
      if (fieldName === "dia" && row === 4 && col === 1) {
        return;
      }

      const element = document.createElement("div");
      element.className = "box";
      element.dataset.field = fieldName;

      element.style.left = (labelX + field.x) + "mm";
      element.style.top = (labelY + field.y) + "mm";
      element.style.width = field.width + "mm";
      element.style.height = field.height + "mm";

      element.textContent = values[fieldName];
      page.appendChild(element);
    });
  }
}

const dialog = document.getElementById("fillDialog");
const form = document.getElementById("fillForm");

document.getElementById("fillBtn").addEventListener("click", function () {
  const date = getCurrentDate();
  document.getElementById("dia").value = date.dia;
  document.getElementById("mes").value = date.mes;
  document.getElementById("ano").value = date.ano;

  dialog.showModal();
  document.getElementById("colaborador").focus();
});

document.getElementById("cancelBtn").addEventListener("click", function () {
  dialog.close();
});

form.addEventListener("submit", function (event) {
  event.preventDefault();

  const newValues = {
    dia: document.getElementById("dia").value.trim(),
    mes: document.getElementById("mes").value.trim(),
    ano: document.getElementById("ano").value.trim(),
    colaborador: document.getElementById("colaborador").value.trim(),
    referencia: document.getElementById("referencia").value.trim()
  };

  Object.assign(values, newValues);

  document.querySelectorAll(".box[data-field]").forEach(function (box) {
    const field = box.dataset.field;
    if (Object.prototype.hasOwnProperty.call(values, field)) {
      box.textContent = values[field];
    }
  });

  dialog.close();
});

document.getElementById("printBtn").addEventListener("click", function () {
  window.print();
});

</script>

</body>
</html>
